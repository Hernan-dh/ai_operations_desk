name: Deploy AI Operations Desk

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ai-operations-desk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment SSH
        env:
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Sync source and rebuild Operations Desk without changing data
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          rsync -az --no-g --exclude '.env' --exclude '.git' --exclude '.n8n' --exclude 'node_modules' --exclude 'coverage' ./ "$NETCUP_USER@$NETCUP_HOST:/srv/ai-operations-desk/"
          ssh -o StrictHostKeyChecking=yes "$NETCUP_USER@$NETCUP_HOST" 'cd /srv/ai-operations-desk && sudo -n docker compose up -d --build'
