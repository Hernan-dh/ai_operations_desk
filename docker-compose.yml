services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations_desk
      POSTGRES_USER: operations_desk
      POSTGRES_PASSWORD: ${CASE_DB_PASSWORD:?Set CASE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/001-cases.sql:/docker-entrypoint-initdb.d/001-cases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations_desk -d operations_desk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/operations-desk-triage-ai
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-45000}
      DATABASE_URL: postgresql://operations_desk:${CASE_DB_PASSWORD}@postgres:5432/operations_desk
      OPERATOR_KEY: ${OPERATOR_KEY:?Set OPERATOR_KEY in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      n8n:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      TZ: ${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./.n8n:/home/node/.n8n
    restart: unless-stopped

volumes:
  postgres-data:
